name: winter_arc
description: A Winter Arc challenge companion app to track goals, study, fitness, and reflections in a gamified way.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.2
  provider: ^6.1.1
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  flutter_local_notifications: ^16.3.2
  permission_handler: ^11.2.0
  share_plus: ^7.2.1
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
